# Render Blueprint — deploys LifeDesk as a single combined web service
# (Express serves the built React app + the /api routes) plus a managed
# PostgreSQL database. Push this repo to GitHub, then in Render:
#   New +  ->  Blueprint  ->  pick this repo  ->  Apply.
# Render reads this file, provisions both resources, and wires DATABASE_URL.

databases:
  - name: lifedesk-db
    databaseName: lifedesk
    user: lifedesk
    plan: free

services:
  - type: web
    name: lifedesk
    runtime: node
    plan: free
    # The app lives in the nested "Life Desk" folder inside the repo.
    rootDir: "Life Desk"
    # Install server + client deps, then build the React app into client/dist.
    buildCommand: npm --prefix server install && npm --prefix client install && npm --prefix client run build
    # Run idempotent migrations, then start the Express server (which also
    # serves client/dist). Render injects PORT automatically.
    startCommand: npm --prefix server run migrate && npm --prefix server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Connection string from the managed database above (SSL handled in db.js).
      - key: DATABASE_URL
        fromDatabase:
          name: lifedesk-db
          property: connectionString
      # Auto-generated secret for signing JWTs.
      - key: JWT_SECRET
        generateValue: true
